packages:
  - packages/adapter-deepseek
  - packages/handoff-deepseek
allowBuilds:
  embedded-postgres: true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-x64': true
  esbuild: true
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
patchedDependencies:
  '@deepseek-ai/dsh-agent-loop@0.2.1-rc.3': patches/@deepseek-ai__dsh-agent-loop@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-agent@0.2.1-rc.3': patches/@deepseek-ai__dsh-agent@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-api-session-controller@0.2.1-rc.3': patches/@deepseek-ai__dsh-api-session-controller@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.3': patches/@deepseek-ai__dsh-client-ui-conversation@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-commands@0.2.1-rc.3': patches/@deepseek-ai__dsh-commands@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.3': patches/@deepseek-ai__dsh-sandbox-policy@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-client-ui-model-selection@0.2.1-rc.3': patches/@deepseek-ai__dsh-client-ui-model-selection@0.2.1-rc.3.patch
