# Use this overlay instead of the base-profile bundle for sdk-minimal.
- id: sessions
  disabled: true
- id: agent-loop
  inject: [sessionPersistence]
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, sessionPersistence]
- insert:
    - id: contextmesh-session-persistence
      name: dsh-contextmesh
      config:
        endpoint: !!js process.env.CONTEXTMESH_ENDPOINT || 'http://127.0.0.1:8787'
        tokenEnv: CONTEXTMESH_TOKEN
