services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: contextmesh
      POSTGRES_DB: contextmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U contextmesh -d contextmesh']
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build:
      context: ..
    environment:
      DATABASE_URL: postgres://contextmesh:${POSTGRES_PASSWORD}@postgres:5432/contextmesh
      CONTEXTMESH_TOKEN: ${CONTEXTMESH_TOKEN:?Set CONTEXTMESH_TOKEN}
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
